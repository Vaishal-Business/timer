<!-- model-viewer -->
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.2.0/model-viewer.min.js"></script>

<input type="file" id="upload" accept=".glb,.usdz" />

<model-viewer 
  id="viewer"
  ar
  ar-modes="webxr scene-viewer quick-look"
  camera-controls
  shadow-intensity="1"
  style="width: 100%; height: 500px;">
</model-viewer>

<script>
const input = document.getElementById('upload');
const viewer = document.getElementById('viewer');

input.addEventListener('change', (event) => {
  const file = event.target.files[0];
  if (!file) return;

  const url = URL.createObjectURL(file);

  if (file.name.endsWith('.usdz')) {
    // iPhone AR uses USDZ
    viewer.setAttribute('ios-src', url);
  } else {
    // Default = GLB
    viewer.setAttribute('src', url);
  }
});
</script>
